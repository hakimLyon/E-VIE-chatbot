{% extends "base.html" %}

{% block title %}Chatbot - E-VIE{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-8">
        <h1 class="text-4xl font-bold mb-2">Chatbot</h1>
        <p class="text-slate-200 text-xl ">Discutez avec notre assistant IA pour obtenir des réponses et une assistance instantanées.</p>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-lg overflow-hidden flex flex-col h-[600px]">
        <!-- Chat Messages -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gradient-to-b from-slate-50 to-white">
            <div class="flex-row flex-wrap text-center py-8">
                <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                </div>
                <p class="text-slate-600">Start a conversation</p>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="border-t border-slate-200 bg-white p-6">
            <form id="chatForm" class="flex gap-3">
                <input 
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    class="flex-1 px-5 py-3 border-2 border-slate-200 text-black rounded-xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none hover:border-slate-300 transition-colors"
                    required
                >
                <button 
                    type="submit"
                    id="sendBtn"
                    class="px-6 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all font-medium disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatMessages = document.getElementById('chatMessages');

    function addMessage(text, isUser) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
        
        const messageBubble = document.createElement('div');
        messageBubble.className = `max-w-xs lg:max-w-md px-5 py-3 rounded-xl text-sm ${
            isUser 
                ? 'bg-indigo-600 text-white rounded-br-none shadow-md' 
                : 'bg-slate-100 border border-slate-300 text-slate-900 rounded-bl-none'
        }`;
        messageBubble.textContent = text;
        
        messageDiv.appendChild(messageBubble);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        return messageDiv;
    }

    function showTypingIndicator() {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'flex justify-start';
        messageDiv.id = 'typingIndicator';
        
        const messageBubble = document.createElement('div');
        messageBubble.className = 'bg-slate-100 border border-slate-300 px-5 py-3 rounded-xl rounded-bl-none';
        messageBubble.innerHTML = '<div class="flex gap-1"><span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></span><span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce delay-100"></span><span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce delay-200"></span></div>';
        
        messageDiv.appendChild(messageBubble);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        return messageDiv;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) {
            indicator.remove();
        }
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const message = messageInput.value.trim();
        if (!message) return;

        // Add user message
        addMessage(message, true);
        messageInput.value = '';
        messageInput.focus();
        sendBtn.disabled = true;

        // Show typing indicator
        showTypingIndicator();

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ message })
            });

            const data = await response.json();
            removeTypingIndicator();

            if (response.ok) {
                addMessage(data.response, false);
            } else {
                addMessage('Sorry, I encountered an error. Please try again.', false);
            }
        } catch (error) {
            removeTypingIndicator();
            addMessage('Sorry, I could not connect to the server.', false);
        } finally {
            sendBtn.disabled = false;
        }
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Clear initial message when user starts typing
    messageInput.addEventListener('focus', () => {
        if (chatMessages.innerHTML.includes('Start a conversation')) {
            const firstMessage = chatMessages.querySelector('div');
            if (firstMessage) {
                firstMessage.remove();
            }
        }
    });
</script>
{% endblock %}
